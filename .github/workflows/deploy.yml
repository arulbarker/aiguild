name: Deploy ke VPS

on:
  push:
    branches: [master]
    # Dokumen tidak memengaruhi app → tidak perlu redeploy.
    # Catatan: deploy tetap jalan kalau push mencampur dokumen + file lain.
    paths-ignore:
      - '.claude/**'
      - '**.md'
      - 'docs/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Env produksi dibagi ke semua step (attempt 1 & retry).
    env:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      MAYAR_PAYMENT_URL: ${{ secrets.MAYAR_PAYMENT_URL }}
      MAYAR_API_BASE: ${{ secrets.MAYAR_API_BASE }}
      MAYAR_PRODUCT_NAME: ${{ secrets.MAYAR_PRODUCT_NAME }}
      MAYAR_API_KEY: ${{ secrets.MAYAR_API_KEY }}
      MAYAR_WEBHOOK_TOKEN: ${{ secrets.MAYAR_WEBHOOK_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      # ATTEMPT 1 — kalau gagal (mis. SSH i/o timeout sesaat), TIDAK menggagalkan
      # job; lanjut ke step retry. Script idempoten → aman dijalankan ulang penuh
      # (env upsert pakai sed, seed mode aman progress dipertahankan).
      - name: Deploy ke VPS via SSH (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.77.122.42
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          envs: ADMIN_EMAIL,CRON_SECRET,MAYAR_PAYMENT_URL,MAYAR_API_BASE,MAYAR_PRODUCT_NAME,MAYAR_API_KEY,MAYAR_WEBHOOK_TOKEN,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            ENVF=/data/aiguild/.env.production
            touch "$ENVF"
            upsert() {
              # $1=key $2=value — lewati kalau value kosong (belum diset di GitHub Secrets)
              [ -z "$2" ] && return 0
              if grep -q "^$1=" "$ENVF"; then
                sed -i "s|^$1=.*|$1=$2|" "$ENVF"
              else
                echo "$1=$2" >> "$ENVF"
              fi
            }
            echo "=== Sinkronisasi env produksi dari GitHub Secrets ==="
            upsert ADMIN_EMAIL "$ADMIN_EMAIL"
            upsert CRON_SECRET "$CRON_SECRET"
            upsert MAYAR_PAYMENT_URL "$MAYAR_PAYMENT_URL"
            upsert MAYAR_API_BASE "$MAYAR_API_BASE"
            upsert MAYAR_PRODUCT_NAME "$MAYAR_PRODUCT_NAME"
            upsert MAYAR_API_KEY "$MAYAR_API_KEY"
            upsert MAYAR_WEBHOOK_TOKEN "$MAYAR_WEBHOOK_TOKEN"
            upsert TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
            upsert TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID"

            bash /data/deploy-aiguild.sh

            echo "=== Sinkronisasi modul (seed aman, progress user dipertahankan) ==="
            cd /data/aiguild
            docker run --rm \
              --network aiguild-net \
              --env-file /data/aiguild/.env.production \
              -v /data/aiguild:/app -w /app \
              node:20-alpine \
              sh -c "apk add --no-cache openssl && npm ci && npx prisma generate && npx prisma db push && npm run seed"

      # Jeda singkat sebelum retry — beri waktu VPS pulih dari gangguan jaringan sesaat.
      - name: Tunggu sebelum retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      # ATTEMPT 2 (retry) — hanya jalan kalau attempt 1 gagal. Step ini TIDAK
      # continue-on-error: kalau retry pun gagal → job ditandai gagal (sesuai harapan).
      - name: Deploy ke VPS via SSH (retry)
        if: steps.deploy1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.77.122.42
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          envs: ADMIN_EMAIL,CRON_SECRET,MAYAR_PAYMENT_URL,MAYAR_API_BASE,MAYAR_PRODUCT_NAME,MAYAR_API_KEY,MAYAR_WEBHOOK_TOKEN,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID
          script: |
            ENVF=/data/aiguild/.env.production
            touch "$ENVF"
            upsert() {
              # $1=key $2=value — lewati kalau value kosong (belum diset di GitHub Secrets)
              [ -z "$2" ] && return 0
              if grep -q "^$1=" "$ENVF"; then
                sed -i "s|^$1=.*|$1=$2|" "$ENVF"
              else
                echo "$1=$2" >> "$ENVF"
              fi
            }
            echo "=== Sinkronisasi env produksi dari GitHub Secrets ==="
            upsert ADMIN_EMAIL "$ADMIN_EMAIL"
            upsert CRON_SECRET "$CRON_SECRET"
            upsert MAYAR_PAYMENT_URL "$MAYAR_PAYMENT_URL"
            upsert MAYAR_API_BASE "$MAYAR_API_BASE"
            upsert MAYAR_PRODUCT_NAME "$MAYAR_PRODUCT_NAME"
            upsert MAYAR_API_KEY "$MAYAR_API_KEY"
            upsert MAYAR_WEBHOOK_TOKEN "$MAYAR_WEBHOOK_TOKEN"
            upsert TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
            upsert TELEGRAM_CHAT_ID "$TELEGRAM_CHAT_ID"

            bash /data/deploy-aiguild.sh

            echo "=== Sinkronisasi modul (seed aman, progress user dipertahankan) ==="
            cd /data/aiguild
            docker run --rm \
              --network aiguild-net \
              --env-file /data/aiguild/.env.production \
              -v /data/aiguild:/app -w /app \
              node:20-alpine \
              sh -c "apk add --no-cache openssl && npm ci && npx prisma generate && npx prisma db push && npm run seed"
